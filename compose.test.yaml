# Unit + e2e tests with only Docker installed: make test
name: ev-charging-test

services:
  tests:
    image: node:22.23.5-bookworm-slim
    working_dir: /src
    user: '${UID:-1000}:${GID:-1000}'
    env_file: .env.test
    environment:
      HOME: /tmp
      # The MongoDB driver loads `os` with a dynamic import(), which Jest's
      # sandbox only supports with this flag; without it the driver sends an
      # empty handshake and the server rejects the connection.
      NODE_OPTIONS: --experimental-vm-modules
    volumes:
      - ./:/src
    command: ['sh', '-c', 'npm ci --no-audit --no-fund --ignore-scripts && npx jest --coverage --ci']
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.2
    tmpfs:
      - /data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 2s
      timeout: 5s
      retries: 30
